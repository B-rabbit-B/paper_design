  - {id: 26, name: chicken,     zh: 鸡肉,   ingredient: 鸡肉,   unit: bulk,  default_weight_g: 500,
     sources: {hyunahko: [chicken, chicken_breast], aicook: [chicken, chicken_breast], custom: [chicken]}}
  - {id: 27, name: pork,        zh: 猪肉,   ingredient: 猪肉,   unit: bulk,  default_weight_g: 250,
     sources: {hyunahko: [pork_belly], custom: [pork]}}
  - {id: 28, name: beef,        zh: 牛肉,   ingredient: 牛肉,   unit: bulk,  default_weight_g: 250,
     sources: {web_raw_beef: [raw_beef], aicook: [beef, ground_beef], custom: [beef]}}
  - {id: 29, name: fish,        zh: 鱼,     ingredient: 鱼,     unit: bulk,  default_weight_g: 500,
     sources: {fishmarket: [fish, aair, boal, chapila, deshi puti, foli, ilish, kal baush, katla, koi, magur, mrigel,
                            pabda, pangas, puti, rui, shol, taki, tara baim, telapiya],
               custom: [fish]}}
  - {id: 30, name: shrimp,      zh: 虾,     ingredient: 虾,     unit: piece, default_weight_g: 15,
     sources: {openimages: [Shrimp], aicook: [shrimp], custom: [shrimp]}}
  - {id: 31, name: tofu,        zh: 豆腐,   ingredient: 豆腐,   unit: bulk,  default_weight_g: 300,
     sources: {lvis: [bean curd/tofu], web_tofu: [tofu], custom: [tofu]}}
  - {id: 32, name: milk,        zh: 牛奶,   ingredient: 牛奶,   unit: piece, default_weight_g: 250,
     sources: {openimages: [Milk], lvis_full: [milk], aicook: [milk], custom: [milk]}}
