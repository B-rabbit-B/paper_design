# 检测类别定义：训练侧与运行侧共用的唯一真源（见 docs/plan/01 §1、§6）
#
# 字段说明
#   id               类别编号，必须从 0 开始连续，顺序即 data.yaml 中 names 的顺序
#   name             模型类名（英文小写下划线），训练与推理返回的类别名
#   zh               中文展示名
#   ingredient       对应 data/ingredients.json 的 name 或 aliases，用于查营养
#                    （鸡肉 → "鸡" 条目的别名，鱼 → "草鱼" 条目的别名）
#   unit             piece = 按个计数 × 单重；bulk = 整份取默认重量
#   default_weight_g 参考单重/份重（克），用户可在页面上修改
#   sources          各数据源里对应的原始类名，供 prepare_dataset.py 做类别映射。
#                    键名就是 training/datasets/raw/ 下的子目录名，类名区分大小写。
#
# 注意：修改 id 顺序或增删类别后，数据集要重建、模型要重训（总纲 §1.4 回溯重验规则）。
#
# 来源类名的核实情况（2026-10-12）
#   lvis       ：LVIS 果蔬子集 data.yaml 的 names，已逐个核对
#   mendeley   ：Mendeley 孟加拉蔬菜 VOC 标注中实际出现的类名，已统计核对；该来源只进训练集
#   openimages ：Open Images V7 class-descriptions-boxable.csv 中的显示名，已核对
#   custom     ：自采数据，标注时直接使用本文件的 name
#   zenodo     ：Zenodo 数据集 data.yaml 的 30 个类名，已核对；Pepper 抽样为甜椒，Salad 抽样为生菜等叶菜
#
# 暂未映射、等待用户决定的情况（见阶段 1 验收记录）
#   cabbage(白菜)：mendeley 和 openimages 的 "Cabbage" 都是卷心菜（圆白菜），不是大白菜
#   egg(鸡蛋)    ：openimages 的 "Egg" 抽样 6 张中 3 张是彩绘复活节蛋
#   chicken、fish：openimages 的 "Chicken"、"Fish" 抽样几乎都是活鸡、活鱼，不采用
#   pork、beef、spinach：已核实的公开来源中都没有
version: 1
classes:
  # ---------------- 蔬菜（id 0–16） ----------------
  - {id: 0,  name: tomato,      zh: 西红柿, ingredient: 西红柿, unit: piece, default_weight_g: 150,
     sources: {lvis: [Tomato, tomato], zenodo: [Tomato], mendeley: [Tomato], openimages: [Tomato], custom: [tomato]}}
  - {id: 1,  name: cucumber,    zh: 黄瓜,   ingredient: 黄瓜,   unit: piece, default_weight_g: 200,
     sources: {lvis: [cucumber/cuke], mendeley: [Cucumber], openimages: [Cucumber], custom: [cucumber]}}
